<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mods — Curse</title>
<style>
  :root { --bg: #0a0d12; --panel: #11161e; --line: #232d3a; --text: #e6e8ee; --muted: #8b93a3; --accent: #4ea3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  .nav { display: flex; align-items: center; gap: 26px; height: 56px; }
  .brand { font-weight: 700; letter-spacing: 0.04em; font-size: 1.1rem; }
  .brand a { color: var(--text); text-decoration: none; }
  .nav ul { display: flex; gap: 24px; list-style: none; align-items: center; flex: 1; }
  .nav a { color: var(--muted); font-size: 0.92rem; }
  .page { padding: 32px 20px 60px; }
  h1 { font-size: 1.5rem; margin-bottom: 10px; }
  .lead { color: var(--muted); margin-bottom: 26px; font-size: 0.96rem; }
  .back { color: var(--muted); font-size: 0.9rem; display: inline-block; margin-top: 26px; }
  .back:hover { color: var(--text); text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><a href="/">Curse</a></div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/docs.html">Documentation</a></li>
    </ul>
  </div>
</header>

<main class="wrap page">
  <h1>Mods</h1>
  <p class="lead">Browse mods and publish your own projects.</p>
  <p><strong>The mod registry is not deployed yet.</strong> This page is reserved for curse-rusts.github.io/mods.</p>
  <p class="back">&larr; Home</p>
</main>
</body>
</html>
