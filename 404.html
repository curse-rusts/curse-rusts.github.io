<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Curse</title>
<style>
  :root { --bg: #0a0d12; --panel: #11161e; --line: #232d3a; --text: #e6e8ee; --muted: #8b93a3; --accent: #4ea3ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--text); }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; text-align: center; padding: 20px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  .nav { display: flex; align-items: center; gap: 26px; height: 56px; }
  .brand { font-weight: 700; letter-spacing: 0.04em; font-size: 1.1rem; }
  .brand a { color: var(--text); text-decoration: none; }
  .nav ul { display: flex; gap: 24px; list-style: none; align-items: center; flex: 1; }
  .nav a { color: var(--muted); font-size: 0.92rem; }
  .page { padding: 60px 20px 80px; }
  h1 { font-size: 2rem; margin-bottom: 12px; }
  p { color: var(--muted); margin-bottom: 22px; font-size: 1.05rem; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font-size: 0.95rem; }
  .btn:hover { border-color: var(--accent); background: #181f2a; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <div class="brand"><a href="/">Curse</a></div>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/docs.html">Documentation</a></li>
    </ul>
  </div>
</header>

<main class="wrap page">
  <h1>404 — page not found</h1>
  <p>The requested address is not available on the Curse website.</p>
  <a class="btn" href="/">Home</a>
</main>
</body>
</html>
